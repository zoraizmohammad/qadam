name: Deploy website to GitHub Pages

# Builds and publishes the static site to GitHub Pages.
# on every push to main (and on manual dispatch).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/build.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check build behavior
        run: npm test

      - name: Build website
        run: npm run build
        env:
          CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
